<body class="calendar-page">
  <header class="site-header reveal">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="MSOE Raider Catholic logo" class="brand-logo" />
        <span class="brand-text">MSOE Raider Catholic</span>
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" id="siteNav">
        <a href="index.html#about">About</a>
        <a href="index.html#mass-times">Mass Times</a>
        <a href="calendar.html">Events</a>
        <a href="index.html#connect">Connect</a>
        <a href="index.html#leadership">Leadership</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section calendar-top-section reveal section-with-ornaments calendar-ambient-section">
      <div class="calendar-ambient" aria-hidden="true">
        <svg class="hero-ambient-svg" viewBox="0 0 1600 700" preserveAspectRatio="none">
          <defs>
            <linearGradient id="calendarArcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(163,15,33,0)" />
              <stop offset="35%" stop-color="rgba(163,15,33,0.28)" />
              <stop offset="65%" stop-color="rgba(212,175,55,0.22)" />
              <stop offset="100%" stop-color="rgba(185,185,185,0)" />
            </linearGradient>
          </defs>

          <g class="ambient-orbit ambient-orbit-one">
            <path
              class="ambient-arc ambient-arc-calendar"
              d="M 140 360 C 340 180, 650 120, 980 170 C 1260 214, 1425 152, 1510 60"
              pathLength="100"
            />
          </g>

          <g class="ambient-ring-group ambient-ring-group-calendar">
            <circle class="ambient-ring" cx="1280" cy="170" r="118" />
            <circle class="ambient-ring ambient-ring-small" cx="1280" cy="170" r="72" />
          </g>

          <g class="ambient-cross ambient-cross-one ambient-cross-calendar">
            <line x1="0" y1="-16" x2="0" y2="16" />
            <line x1="-12" y1="0" x2="12" y2="0" />
          </g>

          <circle class="ambient-dot ambient-dot-one" cx="360" cy="140" r="4" />
          <circle class="ambient-dot ambient-dot-two" cx="1110" cy="110" r="4" />
        </svg>
      </div>

      <svg class="section-corner-ornament" viewBox="0 0 160 160" aria-hidden="true">
        <path d="M18 34 C52 34, 70 52, 70 86" />
        <path d="M42 18 C86 18, 112 44, 112 88" />
        <circle cx="112" cy="88" r="4" />
      </svg>

      <div class="container">
        <div class="section-heading reveal">
          <p class="section-label">Raider Catholic Events</p>
          <h1 class="calendar-page-title">Upcoming Events</h1>
          <p class="section-subtitle" id="calendarStatus">
            Loading upcoming events...
          </p>
        </div>

        <div class="events-grid" id="eventsList"></div>

        <div class="calendar-actions reveal reveal-delay-1">
          <a
            class="button button-primary button-small"
            id="subscribeCalendarButton"
            href="webcal://outlook.office365.com/owa/calendar/3f27e5fcd8c54156a67a04e6c92a556d@msoe.edu/39fd891e541a4016a9fecf8ed36628826223923538709763827/calendar.ics"
          >
            Subscribe to Calendar
          </a>
          <a
            class="calendar-text-link"
            href="https://outlook.office365.com/owa/calendar/3f27e5fcd8c54156a67a04e6c92a556d@msoe.edu/39fd891e541a4016a9fecf8ed36628826223923538709763827/calendar.ics"
            target="_blank"
            rel="noopener noreferrer"
          >
            Download ICS
          </a>
        </div>
      </div>

      <svg class="section-divider" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,72 C170,42 320,28 520,54 C730,82 900,90 1200,42" />
      </svg>
    </section>
  </main>
